# .github/workflows/latex.yml
# Workflow to compile the Lex Universalis Aurea (LUA) Whitepaper

name: LUA LaTeX Compilation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Allows manual triggering from the GitHub UI Actions tab
  workflow_dispatch: 

jobs:
  build_latex:
    # Use a standard Linux runner environment
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup TeXLive and Install Dependencies
        # This action installs the TeXLive distribution quickly
        uses: xu-cheng/latex-action@v2
        with:
          # Use a scheme that covers the required packages (geometry, titletoc, amsmath)
          pre-compile: true 
          
      - name: Run PDFA-LATEX Compilation Sequence (3x for Resolution)
        # The key step: running pdflatex on the master file three times.
        # This resolves the Table of Contents, Bibliography, and page numbers.
        run: |
          echo "Starting compilation of main.tex..."
          pdflatex main.tex
          pdflatex main.tex
          pdflatex main.tex
          
      - name: Archive Final main.pdf Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lex-universalis-aurea-v1_1-pdf
          path: main.pdf # This must match the file generated by the compiler
          retention-days: 7
